name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.10-bookworm
        env:
          POSTGRES_DB: proview_test
          POSTGRES_USER: proview
          POSTGRES_PASSWORD: proview_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U proview -d proview_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://proview:proview_test@127.0.0.1:5432/proview_test?schema=public
      JWT_ACCESS_SECRET: test-only-generated-ci-key-not-valid-for-production-123456
      FRONTEND_URL: http://localhost:3000
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: ../../.data/ci-files
      SEED_DEMO: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.34.6 }
      - uses: actions/setup-node@v4
        with: { node-version: 24.21.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm lint && pnpm typecheck && pnpm test
      - run: pnpm build
      - run: pnpm check:offline
      - run: pnpm --filter @proview/api exec node --import tsx prisma/verify-constraints.ts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:acceptance
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-evidence
          path: |
            test-results
            playwright-report
            apps/api/prisma/migrations
