name: proview
services:
  postgres:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-proview}
      POSTGRES_USER: ${POSTGRES_USER:-proview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set credentials}
    ports: ['127.0.0.1:5432:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
  minio:
    build:
      context: .
      dockerfile: infra/minio.Dockerfile
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: [minio-data:/data]
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 30
  minio-init:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    command: ['node', 'scripts/init-storage.cjs']
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-proview-private}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      minio: { condition: service_healthy }
  api:
    profiles: [production]
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: '3001'
      DATABASE_URL: postgresql://${POSTGRES_USER:-proview}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-proview}?schema=public
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      S3_ENDPOINT: http://minio:9000
      STORAGE_LOCAL_PATH: /app/.data/files
      TRUST_PROXY: 'true'
    volumes: [file-data:/app/.data/files]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
  web:
    profiles: [production]
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
      PROVIEW_API_INTERNAL_URL: http://api:3001
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
  proxy:
    profiles: [production]
    image: nginx:1.28.0-alpine
    ports: ['127.0.0.1:${LOCAL_PROXY_PORT:-8080}:8080']
    volumes: ['./infra/nginx.conf:/etc/nginx/nginx.conf:ro']
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
volumes:
  postgres-data:
  minio-data:
  file-data:
